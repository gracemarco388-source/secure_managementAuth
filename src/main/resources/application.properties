spring.application.name=secure-student-management
server.port=8080

# =========================
# PostgreSQL Database
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/student_management
spring.datasource.username=postgres
spring.datasource.password=MyStrongPassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
security.jwt.secret=MySuperSecretJwtKeyForStudentManagementApplication2026
security.jwt.expiration=900000
security.jwt.refresh-expiration=604800000